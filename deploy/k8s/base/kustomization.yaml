apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api.yaml

configMapGenerator:
  # Values shared by every environment. Overlays add env-specific keys with behavior: merge.
  - name: api-config
    literals:
      - ASPNETCORE_URLS=http://+:8080
      - Database__MigrateOnStartup=true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRD: https://siriautopost.siristudiophoto.com  |  database siriautopost
# Applied by the Jenkinsfile at the repo root (Jenkins job SIRIAUTOPOST-BACKEND).
namespace: siriautopost

resources:
  - ../../base
  - ingress.yaml

images:
  # newTag is rewritten by the Jenkinsfile for every build; the value below is never deployed as-is.
  - name: siriautopost-api
    newName: localhost:5000/siriautopost-api
    newTag: set-by-jenkins

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      # Pinned here so an env file copied from elsewhere cannot change the public origin.
      - Cors__AllowedOrigins__0=https://siriautopost.siristudiophoto.com
  - name: postgres-config
    behavior: merge
    literals:
      - POSTGRES_DB=siriautopost

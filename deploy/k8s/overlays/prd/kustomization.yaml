apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRD: https://siriautopost.siristudiophoto.com  |  database SIRIAUTOPOST_PRD
# Applied by the Jenkinsfile at the repo root (Jenkins job SIRIAUTOPOST-API).
namespace: siriautopost

# No Ingress: the public host goes Cloudflare tunnel -> NodePort 30907 (Service `ui`, siri_autopost_ui),
# and the dashboard's nginx proxies /api to Service `api` below.
resources:
  - ../../base

images:
  # newTag is rewritten by the Jenkinsfile for every build; the value below is never deployed as-is.
  - name: siriautopost-api
    newName: localhost:5000/siriautopost-api
    newTag: set-by-jenkins

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      # Pinned here so an env file copied from elsewhere cannot change the public origin.
      - Cors__AllowedOrigins__0=https://siriautopost.siristudiophoto.com
      # Where Stripe Checkout and the billing portal send customers back to (same reason).
      - Stripe__ReturnBaseUrl=https://siriautopost.siristudiophoto.com

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Optional in-cluster Postgres. The Jenkinsfile applies it only when the env file has POSTGRES_USER and
# POSTGRES_PASSWORD; otherwise the API uses the server in AppSettings__ConnectionStrings (as SIRISTUDIOPHOTO does).
namespace: siriautopost

resources:
  - postgres.yaml

configMapGenerator:
  - name: postgres-config
    literals:
      - POSTGRES_DB=SIRIAUTOPOST_PRD

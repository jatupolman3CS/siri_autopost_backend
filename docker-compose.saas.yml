# The SaaS stack: SIRIAUTOPOST.Api + the Angular dashboard (siri_autopost_ui, cloned next to
# this repo or at UI_PATH) + PostgreSQL. Copy .env.example to .env, set the SaaS values, then:
#   docker compose -f docker-compose.saas.yml up -d --build
# The dashboard serves on ${WEB_PORT:-8090} and proxies /api to the API, so the extension pairs
# with that same origin. For the internet, turn on HTTPS: point DOMAIN's DNS at this machine,
# open ports 80 and 443, set DOMAIN in .env and add the "https" profile:
#   docker compose -f docker-compose.saas.yml --profile https up -d --build
# Caddy then gets and renews a Let's Encrypt certificate (DOMAIN=localhost uses a local test CA).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: siriautopost
      POSTGRES_USER: siriautopost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - saas-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siriautopost -d siriautopost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/SIRIAUTOPOST.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Database=siriautopost;Username=siriautopost;Password=${DB_PASSWORD};Gss Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (32+ characters)}
      Admin__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Google__ClientId: ${Google__ClientId:-}
      # Stripe takes the payments (empty key: paid plans cannot be bought). The webhook endpoint to register
      # in the Stripe dashboard is <public address>/api/webhooks/stripe.
      Stripe__SecretKey: ${Stripe__SecretKey:-}
      Stripe__PublishableKey: ${Stripe__PublishableKey:-}
      Stripe__SubscriptionPaymentMethods: ${Stripe__SubscriptionPaymentMethods:-card,link}
      Stripe__WebhookSecret: ${Stripe__WebhookSecret:-}
      Stripe__ReturnBaseUrl: ${Stripe__ReturnBaseUrl:-}
      Stripe__Currency: ${Stripe__Currency:-thb}
      Stripe__PortalConfigurationId: ${Stripe__PortalConfigurationId:-}
      # AI post drafts (Pro and above): the platform's Anthropic key. Empty = the AI buttons stay off.
      Ai__ApiKey: ${Ai__ApiKey:-}
      Ai__Model: ${Ai__Model:-claude-sonnet-5-5}
      Ai__DailyLimit: ${Ai__DailyLimit:-50}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ${UI_PATH:-../siri_autopost_ui}
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [https]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to web:80
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  saas-pgdata:
  caddy-data:
  caddy-config:

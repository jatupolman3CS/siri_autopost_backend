# Server + PostgreSQL. Copy .env.example to .env, set the passwords, then:
#   docker compose up -d --build
# Put HTTPS in front (Caddy / Nginx / Cloudflare Tunnel) before using it over the internet.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fbautopost
      POSTGRES_USER: fbap
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbap -d fbautopost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # The server replaces the database name with Database:Name (SIRIAUTOPOST_PRD outside Development) and creates
      # that database on first start; fbautopost above is only the one Postgres makes for itself.
      ConnectionStrings__Default: Host=db;Database=fbautopost;Username=fbap;Password=${DB_PASSWORD};Gss Encryption Mode=Disable
      Admin__Username: ${ADMIN_USER:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
